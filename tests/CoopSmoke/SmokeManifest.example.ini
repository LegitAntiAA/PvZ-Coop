# PvZ Co-op smoke manifest schema (the runner generates concrete host/client files).
# Allowed mode/level pairs: adventure/1, adventure/5,
# adventure_bowling_client/5, adventure_whack_client/15,
# slot_machine_client/1, vasebreaker/1, beghouled/1.
# skip_intro is strictly 0 or 1.
schema=1
role=host
endpoint=127.0.0.1
port=27713
nickname=SmokeHost
mode=adventure
level=1
seed=424242
appdata_dir=C:\Temp\PvZ-Coop-Smoke\run_example\host\appdata
config_path=C:\Temp\PvZ-Coop-Smoke\run_example\host\coop.ini
log_dir=C:\Temp\PvZ-Coop-Smoke\run_example\host\logs
result_path=C:\Temp\PvZ-Coop-Smoke\run_example\host\result.json
timeout_ms=120000
minimum_snapshots=3
skip_intro=1
close_on_result=0
