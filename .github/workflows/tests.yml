
name: PvZ Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: NetProtocolTests (Windows x86)
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          "path=$msbuild" >> $env:GITHUB_OUTPUT

      - name: Build unit tests
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.path }}" `
            "tests/NetProtocolTests/NetProtocolTests.vcxproj" `
            /m `
            /p:Configuration=ReleaseGOTY `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run unit tests
        shell: pwsh
        run: |
          $exe = "build/ReleaseGOTY_Win32/tests/NetProtocolTests.exe"

          if (-not (Test-Path $exe)) {
            throw "Test executable not found: $exe"
          }

          & $exe
          exit $LASTEXITCODE
