name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Build ReleaseGOTY
        shell: pwsh
        run: |
          msbuild SexyAppFramework/SexyAppBase.vcxproj /m /p:Configuration=ReleaseGOTY /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143 /verbosity:minimal

      - name: Run network tests (Win32)
        if: matrix.platform == 'Win32'
        shell: pwsh
        run: |
          msbuild tests/NetProtocolTests/NetProtocolTests.vcxproj /m /p:Configuration=ReleaseGOTY /p:Platform=Win32 /p:PlatformToolset=v143 /verbosity:minimal
          & "build/ReleaseGOTY_Win32/tests/NetProtocolTests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package distributable (exclude original game files)
        shell: pwsh
        run: |
          $platform = "${{ matrix.platform }}"
          $source = "build/ReleaseGOTY_${platform}/bin"
          $exe = Join-Path $source "PlantsVsZombies.exe"
          if (!(Test-Path $exe)) { throw "Build output missing: $exe" }
          $stage = Join-Path $env:RUNNER_TEMP "PvZ-Coop-${platform}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe $stage
          Get-ChildItem $source -Filter '*.dll' -File | Copy-Item -Destination $stage
          if (Test-Path 'coop.ini') { Copy-Item 'coop.ini' $stage }
          @'
          PvZ Co-op
          ==========
          This archive does not include the original Plants vs. Zombies game assets.
          You must own the original game and supply its main.pak and properties
          directory from your legally obtained copy, next to PlantsVsZombies.exe.
          See the repository README for instructions.
          '@ | Set-Content (Join-Path $stage 'INSTALL.txt')
          $zip = "PvZ-Coop-${platform}.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PvZ-Coop-${{ matrix.platform }}
          path: PvZ-Coop-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PvZ-Coop-*
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" PvZ-Coop-*.zip --verify-tag --generate-notes --title "PvZ Co-op $TAG"
