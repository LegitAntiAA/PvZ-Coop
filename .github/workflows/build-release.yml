name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Build ReleaseGOTY
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $inc = @(
            'include', 'include/imgui', 'include/sdl3', 'include/sdl3_ttf',
            'include/ImageLib', 'include/bass', 'include/ffmpegWin32',
            'include/portaudio', 'include/tinyfiledialogs', 'include/zlib',
            'include/dx8sdk'
          ) | ForEach-Object { Join-Path $root $_ }
          $libs = @(
            'lib/sdl3/x86', 'lib/sdl3_ttf/x86', 'lib/bassWin32',
            'lib/ffmpegWin32', 'lib/portaudio', 'lib/tinyfiledialogs',
            'lib/zlibWin32', 'lib/dx8sdk'
          ) | ForEach-Object { Join-Path $root $_ }
          # The .vcxproj explicitly sets empty AdditionalIncludeDirectories.
          # MSVC's CL and LINK environment variables inject flags directly.
          $env:CL = (($inc | ForEach-Object { '/I"' + $_ + '"' }) -join ' ')
          $env:LINK = (($libs | ForEach-Object { '/LIBPATH:"' + $_ + '"' }) -join ' ')
          Write-Host "Injected $($inc.Count) include paths and $($libs.Count) library paths"
          foreach ($dir in $inc + $libs) {
            if (!(Test-Path $dir)) { throw "Missing dependency directory: $dir" }
          }
          msbuild SexyAppFramework/SexyAppBase.vcxproj /m /p:Configuration=ReleaseGOTY /p:Platform=Win32 /p:PlatformToolset=v143 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run network tests (Win32)
        if: true
        shell: pwsh
        run: |
          msbuild tests/NetProtocolTests/NetProtocolTests.vcxproj /m /p:Configuration=ReleaseGOTY /p:Platform=Win32 /p:PlatformToolset=v143 /verbosity:minimal
          & "build/ReleaseGOTY_Win32/tests/NetProtocolTests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package distributable (exclude original game files)
        shell: pwsh
        run: |
          $source = "build/ReleaseGOTY_Win32/bin"
          $exe = Join-Path $source "PlantsVsZombies.exe"
          if (!(Test-Path $exe)) { throw "Build output missing: $exe" }
          $stage = Join-Path $env:RUNNER_TEMP "PvZ-Coop-Win32"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe $stage
          Get-ChildItem $source -Filter '*.dll' -File | Copy-Item -Destination $stage
          if (Test-Path 'coop.ini') { Copy-Item 'coop.ini' $stage }
          @'
          PvZ Co-op
          ==========
          This archive does not include the original Plants vs. Zombies game assets.
          You must own the original game and supply its main.pak and properties
          directory from your legally obtained copy, next to PlantsVsZombies.exe.
          See the repository README for instructions.
          '@ | Set-Content (Join-Path $stage 'INSTALL.txt')
          $zip = "PvZ-Coop-Win32.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PvZ-Coop-Win32
          path: PvZ-Coop-Win32.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PvZ-Coop-Win32
          
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" PvZ-Coop-Win32.zip --verify-tag --generate-notes --title "PvZ Co-op $TAG"
